<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 220" fill="#0A0A0A">
  <!-- Clothing Woven Label Brand Mark -->
  <rect x="5" y="5" width="150" height="210" rx="3" fill="#FBFBFB" stroke="#D1D5DB" stroke-width="1.5" stroke-dasharray="4 2" />
  
  <!-- Hanger Loop Indicator -->
  <line x1="60" y1="5" x2="100" y2="5" stroke="#9CA3AF" stroke-width="2" />
  
  <!-- AV Monogram on Label -->
  <g transform="translate(50, 25) scale(0.6)">
    <polygon points="20,80 32,80 47,20 37,20" />
    <polygon points="44,20 56,20 62,45 52,45" />
    <polygon points="50,80 62,80 80,20 70,20" />
    <polygon points="32,58 68,58 65,66 29,66" />
    <polygon points="50,28 53,33 50,38 47,33" />
  </g>
  
  <text x="80" y="105" font-family="'Outfit', 'Inter', sans-serif" font-size="16" font-weight="700" letter-spacing="5" text-anchor="middle">
    AVEEZ
  </text>
  <text x="80" y="120" font-family="'Inter', sans-serif" font-size="8" font-weight="600" letter-spacing="4" fill="#6B7280" text-anchor="middle">
    FASHION
  </text>
  
  <line x1="30" y1="135" x2="130" y2="135" stroke="#E5E7EB" stroke-width="1" />
  
  <text x="80" y="155" font-family="'Inter', sans-serif" font-size="7" font-weight="600" letter-spacing="2" fill="#4B5563" text-anchor="middle">
    ORIGINALS
  </text>
  <text x="80" y="172" font-family="'Inter', sans-serif" font-size="6.5" font-weight="500" letter-spacing="1.5" fill="#6B7280" text-anchor="middle">
    HEAVYWEIGHT EDITION
  </text>
  <text x="80" y="188" font-family="'Inter', sans-serif" font-size="6" font-weight="500" letter-spacing="1.5" fill="#9CA3AF" text-anchor="middle">
    CRAFTED IN INDIA
  </text>
</svg>
